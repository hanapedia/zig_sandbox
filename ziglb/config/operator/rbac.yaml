apiVersion: v1
kind: ServiceAccount
metadata:
  name: ziglb-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ziglb-operator
rules:
  # Core resources - read only
  - apiGroups: [""]
    resources:
      - services
    verbs: ["get", "list", "watch", "create", "update", "delete", "patch"]
  - apiGroups: [""]
    resources:
      - services/status
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ziglb-operator
subjects:
  - kind: ServiceAccount
    name: ziglb-operator
    namespace: default
roleRef:
  kind: ClusterRole
  name: ziglb-operator
  apiGroup: rbac.authorization.k8s.io
