version: '3'

includes:
  http_server: 
    taskfile: ../zig_http_server/Taskfile.yml
    dir: ../zig_http_server/
  debug:
    taskfile: ../debug/Taskfile.yml
    dir: ../debug/

vars:
  OPERATOR_IMAGE_NAME: ziglb-operator
  AGENT_IMAGE_NAME: ziglb-agent
  IMAGE_TAG: latest
  NAMESPACE: default
  K8S_VERSION: "1.33"
  CLUSTER_NAME: ziglb

tasks:
  build:
    desc: Build the Zig binary
    cmds:
      - zig build -Doptimize=ReleaseSafe

  test:
    desc: Run tests
    cmds:
      - zig build test

  image:build:
    desc: Build container image using docker
    cmds:
      - task image:operator:build
      - task image:agent:build

  image:load:
    desc: Load image into kind cluster
    cmds:
      - task image:operator:load
      - task image:agent:load
      - task image:http_server:load
      - task image:debug:load

  # Container image tasks
  image:operator:build:
    desc: Build operator container image using docker
    cmds:
      - docker build -t {{.OPERATOR_IMAGE_NAME}}:{{.IMAGE_TAG}} -f operator.Dockerfile ..

  image:operator:load:
    desc: Load operator image into kind cluster
    deps: [image:operator:build]
    cmds:
      - kind load docker-image {{.OPERATOR_IMAGE_NAME}}:{{.IMAGE_TAG}} --name {{.CLUSTER_NAME}}

  image:agent:build:
    desc: Build agent container image using docker
    cmds:
      - docker build -t {{.AGENT_IMAGE_NAME}}:{{.IMAGE_TAG}} -f agent.Dockerfile ..

  image:agent:load:
    desc: Load agent image into kind cluster
    deps: [image:agent:build]
    cmds:
      - kind load docker-image {{.AGENT_IMAGE_NAME}}:{{.IMAGE_TAG}} --name {{.CLUSTER_NAME}}

  image:http_server:load:
    desc: Load http_server image into kind cluster
    deps: [http_server:image:build]
    cmds:
      - kind load docker-image {{.HTTP_SERVER_IMAGE_NAME}}:{{.IMAGE_TAG}} --name {{.CLUSTER_NAME}}

  image:debug:load:
    desc: Load debug image into kind cluster
    deps: [debug:build]
    cmds:
      - kind load docker-image {{.DEBUG_IMAGE_NAME}}:{{.IMAGE_TAG}} --name {{.CLUSTER_NAME}}

  # Kubernetes deployment tasks
  k8s:deploy:
    desc: Deploy to Kubernetes
    cmds:
      - kustomize build config/operator | kubectl apply -f -
      - kustomize build config/agent | kubectl apply -f -
      - kubectl wait pod --for=condition=Ready -l app=ziglb-operator --timeout=60s
      - kubectl wait pod --for=condition=Ready -l app=ziglb-agent --timeout=60s

  k8s:delete:
    desc: Delete Kubernetes resources
    cmds:
      - kustomize build config/operator | kubectl delete --ignore-not-found -f -
      - kustomize build config/agent | kubectl delete --ignore-not-found -f -

  k8s:redeploy:
    desc: Rebuild, reload image, and redeploy
    cmds:
      - task: k8s:delete
      - task: image:load
      - task: k8s:deploy

  clean:
    desc: Clean build artifacts
    cmds:
      - rm -rf zig-out .zig-cache

  kind:start:
    desc: start kind cluster
    cmds:
      - kind create cluster --config config/kind-config.yaml --name {{.CLUSTER_NAME}}
      - kubectl taint nodes {{.CLUSTER_NAME}}-control-plane node-role.kubernetes.io/control-plane:NoSchedule-

  kind:stop:
    desc: stop kind cluster
    cmds:
      - kind delete cluster --name {{.CLUSTER_NAME}} || true

  external:run:
    desc: Run external router
    deps: [debug:build]
    cmds:
      - >
        docker run -d --rm
        --name router
        --network kind
        --ip 172.18.255.1
        --volume $(pwd)/external/router_bird.conf:/etc/bird/router_bird.conf
        --cap-add NET_ADMIN
        {{.DEBUG_IMAGE_NAME}}:{{.IMAGE_TAG}} /usr/sbin/bird -d -c /etc/bird/router_bird.conf

  external:kill:
    desc: Kill external router
    cmds:
      - docker kill router || true

  connectivity-test:setup:
    desc: Setup LB Service connectivity test
    cmds:
      - task kind:stop
      - task kind:start
      - task image:load
      - task external:kill
      - task external:run
      - task k8s:deploy
      - kubectl apply -f config/lb.yaml
      - kubectl apply -f config/client.yaml
      - sleep 5

  connectivity-test:run:
    desc: Run LB Service connectivity test
    vars:
      LB_IP:
        sh: kubectl get svc lb -oyaml | yq .status.loadBalancer.ingress[0].ip
    cmds:
      - kubectl exec http-client -it -- curl lb.default.svc.cluster.local
      - docker exec -it router curl {{.LB_IP}}
      - docker exec -it router ip r show to {{.LB_IP}} 
